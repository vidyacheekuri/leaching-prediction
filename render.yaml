services:
  - type: web
    name: cement-leaching-prediction
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_APP
        value: app.py
      - key: FLASK_DEBUG
        value: false
    healthCheckPath: /api/status
    plan: starter
    region: oregon

